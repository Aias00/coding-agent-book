<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="550" viewBox="0 0 1020 550" role="img" aria-labelledby="title"><title id="title">回合状态机示意图</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}.mono{font-family:monospace}</style><rect width="100%" height="100%" fill="#f1f6f4"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#278c91"/></marker></defs><text x="45" y="55" fill="#203947" font-size="30" >回合状态与关键交接</text><rect x="45" y="110" width="250" height="80" rx="12" fill="#ffffff" stroke="#b4d3d0"/><text x="170.0" y="158.0" fill="#173d48" font-size="23" text-anchor="middle">idle</text><rect x="385" y="110" width="250" height="80" rx="12" fill="#ffffff" stroke="#b4d3d0"/><text x="510.0" y="158.0" fill="#173d48" font-size="23" text-anchor="middle">preparing</text><rect x="725" y="110" width="250" height="80" rx="12" fill="#ffffff" stroke="#b4d3d0"/><text x="850.0" y="158.0" fill="#173d48" font-size="23" text-anchor="middle">generating</text><rect x="725" y="290" width="250" height="80" rx="12" fill="#ffffff" stroke="#b4d3d0"/><text x="850.0" y="338.0" fill="#173d48" font-size="23" text-anchor="middle">executing</text><rect x="385" y="290" width="250" height="80" rx="12" fill="#ffffff" stroke="#b4d3d0"/><text x="510.0" y="338.0" fill="#173d48" font-size="23" text-anchor="middle">settling</text><rect x="45" y="290" width="250" height="80" rx="12" fill="#ffffff" stroke="#b4d3d0"/><text x="170.0" y="338.0" fill="#173d48" font-size="23" text-anchor="middle">terminal</text><path d="M295 150 L385 150" fill="none" stroke="#278c91" stroke-width="3" marker-end="url(#arrow)"/><path d="M635 150 L725 150" fill="none" stroke="#278c91" stroke-width="3" marker-end="url(#arrow)"/><path d="M850 190 L850 290" fill="none" stroke="#278c91" stroke-width="3" marker-end="url(#arrow)"/><path d="M725 330 L635 330" fill="none" stroke="#278c91" stroke-width="3" marker-end="url(#arrow)"/><path d="M385 330 L295 330" fill="none" stroke="#278c91" stroke-width="3" marker-end="url(#arrow)"/><path d="M510 290 V190" fill="none" stroke="#278c91" stroke-width="3" marker-end="url(#arrow)"/><text x="45" y="450" fill="#4c6873" font-size="22" >取消：停止新派发 → 收集已开始结果 → 保留未知效果 → 终结</text><text x="45" y="500" fill="#4c6873" font-size="22" >awaiting_approval 是持久暂停；terminal 不再启动隐含工作。</text></svg>