<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="450" viewBox="0 0 1040 450" role="img" aria-labelledby="title"><title id="title">外部副作用与结果提交之间的未知窗口</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}.mono{font-family:monospace}</style><rect width="100%" height="100%" fill="#f1f6f4"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#278c91"/></marker></defs><text x="45" y="55" fill="#203947" font-size="30" >执行发生，与结果已知，是两件事</text><rect x="40" y="115" width="210" height="90" rx="12" fill="#fff" stroke="#b4d3d0"/><text x="145.0" y="168.0" fill="#173d48" font-size="21" text-anchor="middle">意图已记录</text><path d="M250 160 L287 160" fill="none" stroke="#278c91" stroke-width="3" marker-end="url(#arrow)"/><rect x="287" y="115" width="210" height="90" rx="12" fill="#fff" stroke="#b4d3d0"/><text x="392.0" y="168.0" fill="#173d48" font-size="21" text-anchor="middle">工具已派发</text><path d="M497 160 L534 160" fill="none" stroke="#278c91" stroke-width="3" marker-end="url(#arrow)"/><rect x="534" y="115" width="210" height="90" rx="12" fill="#fff0d9" stroke="#b4d3d0"/><text x="639.0" y="168.0" fill="#173d48" font-size="21" text-anchor="middle">副作用发生</text><path d="M744 160 L781 160" fill="none" stroke="#278c91" stroke-width="3" marker-end="url(#arrow)"/><rect x="781" y="115" width="210" height="90" rx="12" fill="#fff" stroke="#b4d3d0"/><text x="886.0" y="168.0" fill="#173d48" font-size="21" text-anchor="middle">结果已提交</text><rect x="535" y="240" width="420" height="105" rx="12" fill="#ffedd5" stroke="#dba653"/><text x="558" y="280" fill="#81571b" font-size="24" >在这里崩溃：结果未知</text><text x="558" y="319" fill="#81571b" font-size="20" >先核对现实状态，再决定是否重试</text><path d="M650 210 L650 240" fill="none" stroke="#278c91" stroke-width="3" marker-end="url(#arrow)"/><text x="45" y="400" fill="#4c6873" font-size="23" >持久日志 ≠ 任意外部副作用的原子事务</text></svg>