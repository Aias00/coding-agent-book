<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="530" viewBox="0 0 1020 530" role="img" aria-labelledby="title"><title id="title">授权规范化、摘要绑定与执行前复核</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}.mono{font-family:monospace}</style><rect width="100%" height="100%" fill="#f1f6f4"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#278c91"/></marker></defs><text x="45" y="55" fill="#203947" font-size="30" >授权绑定实际行动，执行前再次复核</text><rect x="45" y="110" width="250" height="80" rx="12" fill="#ffffff" stroke="#b4d3d0"/><text x="170.0" y="158.0" fill="#173d48" font-size="22" text-anchor="middle">规范化参数</text><rect x="385" y="110" width="250" height="80" rx="12" fill="#ffffff" stroke="#b4d3d0"/><text x="510.0" y="158.0" fill="#173d48" font-size="22" text-anchor="middle">行动与权限摘要</text><rect x="725" y="110" width="250" height="80" rx="12" fill="#ffffff" stroke="#b4d3d0"/><text x="850.0" y="158.0" fill="#173d48" font-size="22" text-anchor="middle">Grant</text><path d="M295 150 L385 150" fill="none" stroke="#278c91" stroke-width="3" marker-end="url(#arrow)"/><path d="M635 150 L725 150" fill="none" stroke="#278c91" stroke-width="3" marker-end="url(#arrow)"/><rect x="385" y="300" width="590" height="90" rx="12" fill="#d9efea" stroke="#b4d3d0"/><text x="680.0" y="353.0" fill="#173d48" font-size="23" text-anchor="middle">参数 / 目标 / 策略 / 期限全部匹配</text><path d="M850 190 L850 300" fill="none" stroke="#278c91" stroke-width="3" marker-end="url(#arrow)"/><rect x="45" y="300" width="250" height="90" rx="12" fill="#ffffff" stroke="#b4d3d0"/><text x="170.0" y="353.0" fill="#173d48" font-size="23" text-anchor="middle">资源就绪</text><path d="M295 345 L385 345" fill="none" stroke="#278c91" stroke-width="3" marker-end="url(#arrow)"/><text x="45" y="465" fill="#4c6873" font-size="23" >参数或权限升级发生变化：旧 Grant 失效，重新判断授权。</text></svg>