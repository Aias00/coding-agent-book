<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="460" viewBox="0 0 1020 460" role="img" aria-labelledby="title"><title id="title">并行读取和独占编辑的示意时间线</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}.mono{font-family:monospace}</style><rect width="100%" height="100%" fill="#f1f6f4"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#278c91"/></marker></defs><text x="45" y="55" fill="#203947" font-size="30" >并行执行，有序提交</text><text x="45" y="140" fill="#203947" font-size="23" >A：读取实现</text><text x="45" y="230" fill="#203947" font-size="23" >B：读取测试</text><text x="45" y="320" fill="#203947" font-size="23" >C：独占编辑</text><rect x="250" y="110" width="330" height="48" rx="5" fill="#95d4ca"/><rect x="250" y="200" width="135" height="48" rx="5" fill="#95d4ca"/><rect x="640" y="290" width="240" height="48" rx="5" fill="#e6bd7e"/><text x="430" y="145" fill="#203947" font-size="21" >执行</text><text x="268" y="235" fill="#203947" font-size="21" >执行</text><path d="M600 90 V355" stroke="#278c91" stroke-width="2" stroke-dasharray="7 5"/><text x="615" y="85" fill="#278c91" font-size="20" >屏障</text><text x="410" y="235" fill="#4c6873" font-size="20" >等待 A 后提交 B</text><text x="45" y="410" fill="#4c6873" font-size="22" >示意图：具体调度、限流与取消语义以各项目为准。</text></svg>