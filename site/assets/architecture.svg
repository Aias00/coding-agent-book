<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="630" viewBox="0 0 1020 630" role="img" aria-labelledby="title"><title id="title">Coding Agent 控制面、执行面与事实存储架构</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}.mono{font-family:monospace}</style><rect width="100%" height="100%" fill="#f1f6f4"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#278c91"/></marker></defs><text x="45" y="55" fill="#203947" font-size="28" >控制面拥有决策，执行面产生效果，存储保存事实</text><rect x="45" y="100" width="245" height="80" rx="12" fill="#ffffff" stroke="#b4d3d0"/><text x="167.5" y="148.0" fill="#173d48" font-size="23" text-anchor="middle">CLI / IDE / Web</text><rect x="385" y="100" width="260" height="80" rx="12" fill="#ffffff" stroke="#b4d3d0"/><text x="515.0" y="148.0" fill="#173d48" font-size="23" text-anchor="middle">Session Actor</text><rect x="745" y="100" width="230" height="80" rx="12" fill="#ffffff" stroke="#b4d3d0"/><text x="860.0" y="148.0" fill="#173d48" font-size="23" text-anchor="middle">Model Adapter</text><path d="M290 140 L385 140" fill="none" stroke="#278c91" stroke-width="3" marker-end="url(#arrow)"/><path d="M645 140 L745 140" fill="none" stroke="#278c91" stroke-width="3" marker-end="url(#arrow)"/><rect x="45" y="270" width="245" height="80" rx="12" fill="#ffffff" stroke="#b4d3d0"/><text x="167.5" y="318.0" fill="#173d48" font-size="23" text-anchor="middle">Policy / Grant</text><rect x="385" y="270" width="260" height="80" rx="12" fill="#ffffff" stroke="#b4d3d0"/><text x="515.0" y="318.0" fill="#173d48" font-size="23" text-anchor="middle">Scheduler</text><rect x="745" y="270" width="230" height="80" rx="12" fill="#ffffff" stroke="#b4d3d0"/><text x="860.0" y="318.0" fill="#173d48" font-size="23" text-anchor="middle">Executor</text><path d="M515 180 L515 270" fill="none" stroke="#278c91" stroke-width="3" marker-end="url(#arrow)"/><path d="M290 310 L385 310" fill="none" stroke="#278c91" stroke-width="3" marker-end="url(#arrow)"/><path d="M645 310 L745 310" fill="none" stroke="#278c91" stroke-width="3" marker-end="url(#arrow)"/><rect x="280" y="440" width="480" height="80" rx="12" fill="#d9efea" stroke="#b4d3d0"/><text x="520.0" y="488.0" fill="#173d48" font-size="23" text-anchor="middle">Event Store + Artifact Store</text><path d="M865 350 L760 440" fill="none" stroke="#278c91" stroke-width="3" marker-end="url(#arrow)"/><path d="M515 350 L515 440" fill="none" stroke="#278c91" stroke-width="3" marker-end="url(#arrow)"/><path d="M280 480 L170 180" fill="none" stroke="#278c91" stroke-width="3" marker-end="url(#arrow)"/><text x="45" y="585" fill="#4c6873" font-size="21" >命令提交与事实订阅分开；工具结果通过状态所有者进入下一请求。</text></svg>