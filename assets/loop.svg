<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="450" viewBox="0 0 1020 450" role="img" aria-labelledby="title"><title id="title">任务执行循环及六项责任</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}.mono{font-family:monospace}</style><rect width="100%" height="100%" fill="#f1f6f4"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#278c91"/></marker></defs><text x="45" y="55" fill="#203947" font-size="30" >一次任务中的六个责任</text><rect x="45" y="100" width="270" height="80" rx="12" fill="#ffffff" stroke="#b4d3d0"/><text x="180.0" y="148.0" fill="#173d48" font-size="23" text-anchor="middle">接纳输入</text><rect x="370" y="100" width="270" height="80" rx="12" fill="#ffffff" stroke="#b4d3d0"/><text x="505.0" y="148.0" fill="#173d48" font-size="23" text-anchor="middle">形成请求</text><rect x="695" y="100" width="270" height="80" rx="12" fill="#ffffff" stroke="#b4d3d0"/><text x="830.0" y="148.0" fill="#173d48" font-size="23" text-anchor="middle">模型生成</text><rect x="45" y="250" width="270" height="80" rx="12" fill="#ffffff" stroke="#b4d3d0"/><text x="180.0" y="298.0" fill="#173d48" font-size="23" text-anchor="middle">提交与验证</text><rect x="370" y="250" width="270" height="80" rx="12" fill="#ffffff" stroke="#b4d3d0"/><text x="505.0" y="298.0" fill="#173d48" font-size="23" text-anchor="middle">工具副作用</text><rect x="695" y="250" width="270" height="80" rx="12" fill="#ffffff" stroke="#b4d3d0"/><text x="830.0" y="298.0" fill="#173d48" font-size="23" text-anchor="middle">执行决策</text><path d="M315 140 L370 140" fill="none" stroke="#278c91" stroke-width="3" marker-end="url(#arrow)"/><path d="M640 140 L695 140" fill="none" stroke="#278c91" stroke-width="3" marker-end="url(#arrow)"/><path d="M830 180 L830 250" fill="none" stroke="#278c91" stroke-width="3" marker-end="url(#arrow)"/><path d="M695 290 L640 290" fill="none" stroke="#278c91" stroke-width="3" marker-end="url(#arrow)"/><path d="M370 290 L315 290" fill="none" stroke="#278c91" stroke-width="3" marker-end="url(#arrow)"/><text x="45" y="400" fill="#4c6873" font-size="22" >循环依据结果继续；完成依据验证，而非助手自述。</text></svg>